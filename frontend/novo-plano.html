<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Study IA — Novo Plano</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/dashboard.css"/>
  <link rel="stylesheet" href="css/pages/novo-plano.css"/>
</head>
<body>


  <aside class="sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon">⚡</span>
      <span class="logo-text">Study <strong>IA</strong></span>
    </div>

    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item">
        <span class="nav-icon">🏠</span> Dashboard
      </a>
      <a href="novo-plano.html" class="nav-item active">
        <span class="nav-icon">➕</span> Novo Plano
      </a>
      <a href="#" class="nav-item">
        <span class="nav-icon">📚</span> Meus Planos
      </a>
      <a href="#" class="nav-item">
        <span class="nav-icon">📊</span> Progresso
      </a>
      <a href="#" class="nav-item">
        <span class="nav-icon">⚙️</span> Configurações
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" id="user-avatar">D</div>
        <div class="user-details">
          <span class="user-name" id="user-name">Carregando...</span>
          <span class="user-email" id="user-email"></span>
        </div>
      </div>
      <button class="btn-logout" onclick="logout()">Sair</button>
    </div>
  </aside>


  <main class="main-content">


    <header class="topbar">
      <div>
        <h1 class="topbar-title">Novo Plano de Estudo ✨</h1>
        <p class="topbar-sub">Preencha os campos e a IA vai gerar um plano personalizado para você.</p>
      </div>
    </header>


    <section class="plano-layout">

      <div class="plano-form-card">
        <h2 class="form-titulo">📋 Dados do Plano</h2>

        <div id="mensagem-plano" class="mensagem-plano" style="display:none;"></div>

        <form id="form-plano">

          <div class="field-group">
            <label for="materia">Matéria</label>
            <input
              type="text"
              id="materia"
              placeholder="Ex: Matemática, Português, Física..."
              required
            />
          </div>

          <div class="field-group">
            <label for="nivel">Nível de Ensino</label>
            <select id="nivel" required>
              <option value="" disabled selected>Selecione o nível</option>
              <option value="Ensino Fundamental">Ensino Fundamental</option>
              <option value="Ensino Médio">Ensino Médio</option>
              <option value="ENEM">ENEM</option>
              <option value="Vestibular">Vestibular</option>
              <option value="Concurso Público">Concurso Público</option>
            </select>
          </div>

          <div class="field-group">
            <label for="conteudo">Conteúdo Específico</label>
            <textarea
              id="conteudo"
              rows="4"
              placeholder="Ex: Equações do 2º grau, Funções, Trigonometria..."
              required
            ></textarea>
          </div>

          <button type="submit" class="btn-gerar" id="btn-gerar">
            ✨ Gerar Plano com IA
          </button>

        </form>
      </div>


      <div class="plano-resultado" id="resultado-area" style="display:none;">
        <div class="resultado-header">
          <h2>📚 Seu Plano de Estudo</h2>
          <button class="btn-copiar" onclick="copiarPlano()">📋 Copiar</button>
        </div>
        <div class="resultado-conteudo" id="resultado-conteudo"></div>
      </div>

    </section>

  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/novo-plano.js"></script>
  <script>

    if (!getToken()) window.location.href = "index.html";


    const usuario = JSON.parse(localStorage.getItem("study_usuario") || "{}");
    if (usuario.nome) {
      document.getElementById("user-name").textContent  = usuario.nome;
      document.getElementById("user-email").textContent = usuario.email;
      document.getElementById("user-avatar").textContent = usuario.nome[0].toUpperCase();
    }

    function logout() {
      removerToken();
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
